[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-firewall-mcp"
version = "0.2.0"
description = "MCP server that gives any AI your files with personal data tokenized."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pii-firewall>=0.2.0", "mcp>=2,<3"]

[project.scripts]
pii-firewall-mcp = "pii_firewall_mcp.server:main"

[tool.setuptools]
packages = ["pii_firewall_mcp"]
