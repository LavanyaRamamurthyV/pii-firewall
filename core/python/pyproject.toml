[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-firewall"
version = "0.2.0"
description = "Detect and redact personal information before it reaches an AI model."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pii-firewall = "pii_firewall.cli:main"

[tool.setuptools]
packages = ["pii_firewall"]

[tool.setuptools.package-data]
pii_firewall = ["data/*.json"]
